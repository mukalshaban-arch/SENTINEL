name: CI Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the light test deps — the ML stack in requirements.txt
      # (PaddleOCR, EasyOCR, spaCy, InsightFace, geopandas) is deliberately
      # not installed: every module lazy-loads it inside functions, so the
      # unit suite never needs it and CI stays fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        env:
          SENTINEL_JWT_SECRET: ci-test-secret-key-not-for-production-0000000
        run: |
          pytest tests/unit \
            --cov=auth --cov=nationalities --cov=geocode \
            --cov=tiles --cov=nlp_extract --cov=face_match --cov=server \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  # End-to-end: real PostgreSQL, real server.py, real HTTP. Exercises the
  # whole stack the way the app is actually used, catching wiring the unit
  # suite can't see (routing, auth middleware, SQL, serialization).
  #
  # Deliberately installs requirements-test.txt, NOT requirements.txt: the
  # heavy ML stack (PaddleOCR, EasyOCR, spaCy, InsightFace, geopandas — GBs)
  # is lazy-loaded inside functions, so the server runs without it. The two
  # affected checks degrade gracefully rather than fail:
  #   - NLP: extract_entities() returns an empty result and the job is still
  #     marked 'reviewed', which is what the test asserts.
  #   - Face search: the endpoint returns 503 when InsightFace is absent,
  #     which the test accepts as reachable.
  # Extraction/recognition *quality* is verified locally, not in CI.
  e2e:
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SENTINEL_DB_HOST: localhost
      SENTINEL_DB_PORT: 5432
      SENTINEL_DB_NAME: sentinel
      SENTINEL_DB_USER: postgres
      SENTINEL_DB_PASS: postgres
      SENTINEL_PORT: 8090
      SENTINEL_JWT_SECRET: ci-e2e-secret-key-not-for-production-00000000
      SENTINEL_TEST_BASE_URL: http://localhost:8090

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # schema.sql creates the pgcrypto and unaccent extensions, which need
      # superuser — hence connecting as postgres rather than a scoped role.
      - name: Load schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d sentinel -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d sentinel -v ON_ERROR_STOP=1 -f sample_data.sql

      - name: Start SENTINEL server
        run: |
          python server.py > server-stdout.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/ > /dev/null; then
              echo "Server is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to start within 30s."
          exit 1

      - name: Run end-to-end integration suite
        run: python tests/integration/run_all.py

      # server-stdout.log captures startup/import failures; sentinel.log is
      # the app's own request/error log (logging.FileHandler in server.py).
      - name: Dump server logs
        if: failure()
        run: |
          echo "=== server-stdout.log ==="
          cat server-stdout.log || true
          echo "=== sentinel.log ==="
          tail -n 200 sentinel.log || true

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            server-stdout.log
            sentinel.log
          if-no-files-found: ignore
