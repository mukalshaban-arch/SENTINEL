name: CI Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the light test deps — the ML stack in requirements.txt
      # (PaddleOCR, EasyOCR, spaCy, InsightFace, geopandas) is deliberately
      # not installed: every module lazy-loads it inside functions, so the
      # unit suite never needs it and CI stays fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        env:
          SENTINEL_JWT_SECRET: ci-test-secret-key-not-for-production-0000000
        run: |
          pytest tests/unit \
            --cov=auth --cov=nationalities --cov=geocode \
            --cov=tiles --cov=nlp_extract --cov=face_match --cov=server \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore
