<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SENTINEL — Country Profiles</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css"/>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"/>
  <link rel="stylesheet" href="sentinel.css"/>
  <script>
    /* Apply saved theme before first paint to avoid a flash of the wrong theme */
    (function () {
      var t = localStorage.getItem('snt_theme') === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .country-card{
      background:var(--panel);border:1px solid var(--border);padding:18px;
      cursor:pointer;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;
      display:flex;flex-direction:column;gap:10px;
    }
    .country-card:hover{border-color:var(--accent2);transform:translateY(-1px)}
    .country-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .country-flag-icon{
      width:38px;height:38px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      background:var(--panel2);border:1px solid var(--border);
      font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--accent);
    }
    .country-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em;color:var(--text-hi)}
    .country-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
    .country-stat{background:var(--panel2);border:1px solid var(--border);padding:8px 4px}
    .country-stat .v{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--text-hi);line-height:1}
    .country-stat .l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;margin-top:3px}

    .country-detail-header{background:var(--panel);border:1px solid var(--border);padding:22px;margin-bottom:18px}
    .country-detail-title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:.03em;color:var(--text-hi);line-height:1}
    .country-detail-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.08em;margin-top:4px}

    .mini-entity-card{
      display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);
      padding:10px 12px;text-decoration:none;color:inherit;transition:border-color .15s;
    }
    .mini-entity-card:hover{border-color:var(--accent2)}
    .mini-entity-photo{
      width:36px;height:44px;flex-shrink:0;object-fit:cover;background:var(--panel);
      border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .mini-entity-photo img{width:100%;height:100%;object-fit:cover}
    .mini-entity-name{font-size:12px;color:var(--text-hi);font-weight:500}
    .mini-entity-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:2px}
    .entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

    .country-search-empty{padding:48px 20px;text-align:center;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12px}
    #countryMap{height:420px}
  </style>
</head>
<body>
<div class="class-banner">⚠ RESTRICTED ACCESS — AUTHORISED PERSONNEL ONLY ⚠</div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-body" id="pageBody">

      <!-- ══ LIST VIEW ══ -->
      <div id="listView">
        <div class="page-heading flex-between">
          <div>
            <h2>Country Profiles</h2>
            <div class="sub">Persons, groups and activities aggregated by country</div>
          </div>
        </div>

        <div class="grid-4 mb-16" id="overallStats"></div>

        <div class="filters" style="margin-bottom:16px">
          <div class="search-bar" style="max-width:340px"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5"/></svg>
            <input type="text" id="countrySearch" placeholder="Search countries…" oninput="renderCountryGrid()"/>
          </div>
          <select class="form-select" id="countrySort" style="width:200px" onchange="renderCountryGrid()">
            <option value="risk">Sort: Highest Risk First</option>
            <option value="persons">Sort: Most Persons</option>
            <option value="activities">Sort: Most Activities</option>
            <option value="name">Sort: Name (A–Z)</option>
          </select>
        </div>

        <div class="country-grid" id="countryGrid">
          <div style="color:var(--text-dim);font-size:12px">Loading country profiles…</div>
        </div>
      </div>

      <!-- ══ DETAIL VIEW (hidden until a country is opened) ══ -->
      <div id="detailView" class="hidden">
        <button class="btn btn-secondary btn-sm mb-16" onclick="showList()">← Back to Country Profiles</button>
        <div id="detailContent"></div>
      </div>

    </div>
  </div>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="sentinel.js"></script>
<script>
const user = requireAuth();
buildSidebar('countries');
buildTopbar([{label:'Country Profiles'}]);
initTopbar();

let allCountries = [];
let currentCountry = null;
let countryMapObj = null;
let countryMarkers = [];
let countryFilteredActivities = [];
const SEV_COL = {CRITICAL:'#e84a4a',HIGH:'#e88a4a',MEDIUM:'#e8c44a',LOW:'#4ae87a'};

/* ── INITIAL LOAD ─────────────────────────────────────────── */
(async () => {
  try {
    allCountries = await API.countries();
    renderOverallStats();
    renderCountryGrid();

    // Deep-link support: countries.html?name=Kenya
    const wanted = new URLSearchParams(location.search).get('name');
    if (wanted) openCountry(wanted);
  } catch(e) {
    document.getElementById('countryGrid').innerHTML =
      `<div class="country-search-empty" style="color:var(--danger)">Failed to load country profiles: ${escHtml(e.message)}</div>`;
  }
})();

function renderOverallStats() {
  const totalPersons    = allCountries.reduce((s,c)=>s+c.personCount,0);
  const totalGroups     = allCountries.reduce((s,c)=>s+c.groupCount,0);
  const totalActivities = allCountries.reduce((s,c)=>s+c.activityCount,0);
  const totalCritical   = allCountries.reduce((s,c)=>s+c.criticalCount,0);

  document.getElementById('overallStats').innerHTML = [
    {val: allCountries.length, label:'Countries Tracked',   color:'var(--accent)'},
    {val: totalPersons,        label:'Persons of Interest', color:'var(--accent2)'},
    {val: totalGroups,         label:'Groups of Interest',  color:'var(--accent2)'},
    {val: totalCritical,       label:'Critical-Risk POI',   color:'var(--danger)'},
  ].map(s=>`
    <div class="stat-tile">
      <div class="s-val" style="color:${s.color}">${s.val}</div>
      <div class="s-label">${s.label}</div>
    </div>`).join('');
}

/* ── LIST GRID ─────────────────────────────────────────────── */
function renderCountryGrid() {
  const q    = document.getElementById('countrySearch').value.toLowerCase();
  const sort = document.getElementById('countrySort').value;

  let list = allCountries.filter(c => !q || c.name.toLowerCase().includes(q));

  const sorters = {
    risk:       (a,b)=> (b.criticalCount-a.criticalCount) || (b.highRiskCount-a.highRiskCount) || a.name.localeCompare(b.name),
    persons:    (a,b)=> b.personCount-a.personCount || a.name.localeCompare(b.name),
    activities: (a,b)=> b.activityCount-a.activityCount || a.name.localeCompare(b.name),
    name:       (a,b)=> a.name.localeCompare(b.name),
  };
  list = [...list].sort(sorters[sort] || sorters.risk);

  if (!list.length) {
    document.getElementById('countryGrid').innerHTML =
      `<div class="country-search-empty">No countries match "${escHtml(q)}".</div>`;
    return;
  }

  document.getElementById('countryGrid').innerHTML = list.map(c => `
    <a href="countries.html?name=${encodeURIComponent(c.name)}" class="country-card" onclick="event.preventDefault();openCountry('${escHtml(c.name).replace(/'/g,"\\'")}')">
      <div class="country-card-top">
        <div class="flex flex-gap-8" style="align-items:center">
          <div class="country-flag-icon">${escHtml(c.name.slice(0,2).toUpperCase())}</div>
          <div>
            <div class="country-name">${escHtml(c.name)}</div>
            ${c.topRisk ? riskBadge(c.topRisk) : '<span class="badge badge-grey">NO POI DATA</span>'}
          </div>
        </div>
      </div>
      <div class="country-stats-row">
        <div class="country-stat"><div class="v">${c.personCount}</div><div class="l">Persons</div></div>
        <div class="country-stat"><div class="v">${c.groupCount}</div><div class="l">Groups</div></div>
        <div class="country-stat"><div class="v">${c.activityCount}</div><div class="l">Activities</div></div>
        <div class="country-stat"><div class="v">${c.hotspotCount}</div><div class="l">Hotspots</div></div>
      </div>
    </a>`).join('');
}

function showList() {
  history.replaceState(null, '', 'countries.html');
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('listView').classList.remove('hidden');
  if (countryMapObj) { countryMapObj.remove(); countryMapObj = null; }
  countryMarkers = [];
  countryFilteredActivities = [];
}

/* ── DETAIL VIEW ──────────────────────────────────────────── */
async function openCountry(name) {
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  document.getElementById('detailContent').innerHTML =
    `<div style="display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text-dim)">
       <span class="spinner"></span> Loading ${escHtml(name)} profile…
     </div>`;
  history.replaceState(null, '', `countries.html?name=${encodeURIComponent(name)}`);

  try {
    currentCountry = await API.country(name);
    countryFilteredActivities = currentCountry.activities || [];
    renderDetail();
  } catch(e) {
    document.getElementById('detailContent').innerHTML =
      `<div class="country-search-empty" style="color:var(--danger)">Failed to load profile: ${escHtml(e.message)}</div>`;
  }
}

function renderDetail() {
  const c = currentCountry;
  const persons    = c.persons || [];
  const groups     = c.groups  || [];
  const activities = c.activities || [];
  const hotspots   = c.hotspots || [];

  const critical = persons.filter(p=>p.risk_level==='CRITICAL').length;
  const highRisk = persons.filter(p=>['CRITICAL','HIGH'].includes(p.risk_level)).length;
  const geoPoints = [
    ...activities.filter(a=>a.lat&&a.lng).map(a=>({...a,kind:'activity'})),
    ...hotspots.filter(h=>h.lat&&h.lng).map(h=>({...h,kind:'hotspot'})),
  ];

  document.getElementById('detailContent').innerHTML = `
    <div class="country-detail-header">
      <div class="flex-between" style="flex-wrap:wrap;gap:14px">
        <div class="flex flex-gap-16" style="align-items:center">
          <div class="country-flag-icon" style="width:56px;height:56px;font-size:20px">${escHtml(c.name.slice(0,2).toUpperCase())}</div>
          <div>
            <div class="country-detail-title">${escHtml(c.name)}</div>
            <div class="country-detail-sub">COUNTRY PROFILE · ${persons.length} POI · ${groups.length} groups · ${activities.length} activities</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="printCountryReport()">🖨 Print Report</button>
      </div>
      <div class="grid-4 mt-16">
        <div class="stat-tile"><div class="s-val" style="color:var(--danger)">${critical}</div><div class="s-label">Critical Risk</div></div>
        <div class="stat-tile"><div class="s-val" style="color:var(--warning)">${highRisk}</div><div class="s-label">High + Critical</div></div>
        <div class="stat-tile"><div class="s-val" style="color:var(--accent2)">${groups.length}</div><div class="s-label">Groups Based Here</div></div>
        <div class="stat-tile"><div class="s-val" style="color:var(--accent)">${hotspots.length}</div><div class="s-label">Known Hotspots</div></div>
      </div>
    </div>

    <div id="tabContainer">
      <div class="tabs">
        <button class="tab-btn active" data-target="tOverview">Overview</button>
        <button class="tab-btn" data-target="tGIS">GIS Map${geoPoints.length?` <span class="nav-badge">${geoPoints.length}</span>`:''}</button>
        <button class="tab-btn" data-target="tPersons">Persons <span class="nav-badge">${persons.length}</span></button>
        <button class="tab-btn" data-target="tGroups">Groups <span class="nav-badge">${groups.length}</span></button>
        <button class="tab-btn" data-target="tTimeline">Activity Timeline <span class="nav-badge">${activities.length}</span></button>
        <button class="tab-btn" data-target="tMedia">Media</button>
      </div>

      ${activities.length > 1 ? `
      <div class="card mb-16">
        <div class="card-header"><span class="card-title">Filter by Date Range</span></div>
        <div id="countryDateSliderArea"></div>
      </div>` : ''}

      <!-- OVERVIEW -->
      <div id="tOverview" class="tab-panel active">
        <div class="grid-2" style="gap:16px">
          <div class="card">
            <div class="card-header"><span class="card-title">Risk Breakdown</span></div>
            <table class="data-table">
              ${[['Critical',persons.filter(p=>p.risk_level==='CRITICAL').length,'badge-red'],
                 ['High',persons.filter(p=>p.risk_level==='HIGH').length,'badge-red'],
                 ['Medium',persons.filter(p=>p.risk_level==='MEDIUM').length,'badge-amber'],
                 ['Low',persons.filter(p=>p.risk_level==='LOW').length,'badge-green']
                ].map(([l,v,cls])=>`<tr><td><span class="badge ${cls}" style="font-size:9px">${l}</span></td>
                  <td style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text-hi)">${v}</td></tr>`).join('')}
            </table>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Activity Type Breakdown</span></div>
            <table class="data-table" id="activityTypeTable">
              ${Object.entries(activities.reduce((acc,a)=>{acc[a.type]=(acc[a.type]||0)+1;return acc;},{}))
                .sort((a,b)=>b[1]-a[1])
                .map(([type,count])=>`<tr><td class="text-dim mono" style="font-size:11px">${escHtml(type)}</td>
                  <td style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text-hi)">${count}</td></tr>`).join('')
                || '<tr><td class="text-dim" style="font-size:12px">No activities recorded.</td></tr>'}
            </table>
          </div>
        </div>

        ${persons.length ? `
        <div class="card mt-16">
          <div class="card-header"><span class="card-title">Notable Persons</span>
            <button class="tab-btn" onclick="document.querySelector('[data-target=tPersons]').click()" style="font-size:11px;color:var(--accent2)">View all →</button>
          </div>
          <div class="entity-grid">
            ${[...persons].sort((a,b)=>({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3}[a.risk_level]??9)-({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3}[b.risk_level]??9)).slice(0,6).map(p=>`
              <a href="person.html?id=${p.id}" class="mini-entity-card">
                <div class="mini-entity-photo">${p.photo?`<img src="${p.photo}"/>`:iUsers}</div>
                <div><div class="mini-entity-name">${escHtml(p.alias)}</div>
                  <div class="mini-entity-meta">${riskBadge(p.risk_level)}</div></div>
              </a>`).join('')}
          </div>
        </div>` : ''}

        ${groups.length ? `
        <div class="card mt-16">
          <div class="card-header"><span class="card-title">Groups Based Here</span>
            <button class="tab-btn" onclick="document.querySelector('[data-target=tGroups]').click()" style="font-size:11px;color:var(--accent2)">View all →</button>
          </div>
          <div class="entity-grid">
            ${groups.slice(0,6).map(g=>`
              <a href="group.html?id=${g.id}" class="mini-entity-card">
                <div class="mini-entity-photo">${iGroup}</div>
                <div><div class="mini-entity-name">${escHtml(g.name)}</div>
                  <div class="mini-entity-meta">${threatBadge(g.threat_level)}</div></div>
              </a>`).join('')}
          </div>
        </div>` : ''}
      </div>

      <!-- GIS MAP -->
      <div id="tGIS" class="tab-panel">
        <div class="card">
          <div class="card-header"><span class="card-title">GIS — ${escHtml(c.name)} Activity &amp; Hotspot Locations</span></div>
          ${geoPoints.length === 0
            ? `<div style="padding:40px;text-align:center;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12px">
                 No geo-tagged activities or hotspots recorded for ${escHtml(c.name)} yet.</div>`
            : `<div style="position:relative">
                 <div id="countryMap"></div>
                 <div class="map-legend-panel">
                   <div style="color:var(--text-hi);margin-bottom:6px;font-size:10px">SEVERITY</div>
                   ${[['CRITICAL','#e84a4a'],['HIGH','#e88a4a'],['MEDIUM','#e8c44a'],['LOW','#4ae87a']].map(([s,col])=>
                     `<div class="map-legend-row"><div class="map-legend-dot" style="background:${col}"></div>${s}</div>`).join('')}
                   <div style="color:var(--text-hi);margin:8px 0 4px;font-size:10px">OTHER</div>
                   <div class="map-legend-row"><div class="map-legend-dot" style="background:#4a8fe8;border:2px solid #fff"></div>Hotspot</div>
                 </div>
                 <div class="map-stat-overlay">
                   <div class="map-stat-chip" id="countryMapCountChip">${activities.filter(a=>a.lat&&a.lng).length} activities</div>
                   <div class="map-stat-chip">${hotspots.length} hotspots</div>
                 </div>
               </div>`}
        </div>
      </div>

      <!-- PERSONS -->
      <div id="tPersons" class="tab-panel">
        <div class="card">
          <div class="card-header"><span class="card-title">All Persons of Interest in ${escHtml(c.name)}</span></div>
          ${persons.length ? `<div style="overflow-x:auto"><table class="data-table">
            <thead><tr><th></th><th>Alias</th><th>Name</th><th>Risk</th><th>Status</th><th>Last Location</th><th></th></tr></thead>
            <tbody>${persons.map(p=>`
              <tr>
                <td><div class="mini-entity-photo">${p.photo?`<img src="${p.photo}"/>`:iUsers}</div></td>
                <td class="text-hi" style="font-weight:500">${escHtml(p.alias)}</td>
                <td>${escHtml(p.first_name||'')} ${escHtml(p.last_name||'')}</td>
                <td>${riskBadge(p.risk_level)}</td>
                <td>${statusBadge(p.status)}</td>
                <td class="text-dim">${escHtml(p.last_location||'—')}</td>
                <td><a href="person.html?id=${p.id}" class="btn btn-secondary btn-sm">${iEye} View</a></td>
              </tr>`).join('')}</tbody>
          </table></div>` : '<div style="color:var(--text-dim);font-size:12px;padding:12px 0">No persons recorded for this country.</div>'}
        </div>
      </div>

      <!-- GROUPS -->
      <div id="tGroups" class="tab-panel">
        <div class="card">
          <div class="card-header"><span class="card-title">All Groups Based in ${escHtml(c.name)}</span></div>
          ${groups.length ? `<div style="overflow-x:auto"><table class="data-table">
            <thead><tr><th>Name</th><th>Type</th><th>Threat</th><th>Status</th><th>Members</th><th></th></tr></thead>
            <tbody>${groups.map(g=>`
              <tr>
                <td class="text-hi" style="font-weight:500">${escHtml(g.name)}</td>
                <td class="text-dim">${escHtml(g.type||'—')}</td>
                <td>${threatBadge(g.threat_level)}</td>
                <td>${statusBadge(g.status)}</td>
                <td>${(g.members||[]).length}</td>
                <td><a href="group.html?id=${g.id}" class="btn btn-secondary btn-sm">${iEye} View</a></td>
              </tr>`).join('')}</tbody>
          </table></div>` : '<div style="color:var(--text-dim);font-size:12px;padding:12px 0">No groups recorded for this country.</div>'}
        </div>
      </div>

      <!-- TIMELINE -->
      <div id="tTimeline" class="tab-panel">
        <div class="card">
          <div class="card-header"><span class="card-title">Activity Timeline — ${escHtml(c.name)}</span></div>
          <div id="countryTimelineWrap">${SUI.timeline(activities, {showPoi:true, linkItems:true})}</div>
        </div>
      </div>

      <!-- MEDIA -->
      <div id="tMedia" class="tab-panel">
        <div class="card">
          <div class="card-header"><span class="card-title">Photographs — Persons in ${escHtml(c.name)}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)">Read-only · manage photos from each person's record</span>
          </div>
          <div class="entity-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))" id="countryPhotoGrid">
            ${persons.filter(p=>p.photo).length
              ? persons.filter(p=>p.photo).map(p=>`
                <a href="person.html?id=${p.id}" style="display:block;background:var(--panel2);border:1px solid var(--border);overflow:hidden;text-decoration:none">
                  <img src="${p.photo}" alt="${escHtml(p.alias)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"/>
                  <div style="padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim)">${escHtml(p.alias)}</div>
                </a>`).join('')
              : '<div style="grid-column:1/-1;color:var(--text-dim);font-size:12px;padding:12px 0">No profile photographs on file for persons in this country yet.</div>'}
          </div>
        </div>
      </div>
    </div>`;

  initTabs('tabContainer');
  initCountryDateSlider();
  document.querySelectorAll('[data-target="tGIS"]').forEach(b=>b.addEventListener('click',()=>setTimeout(initCountryMap,150)));
}

/* ── DATE SLIDER ──────────────────────────────────────────── */
function initCountryDateSlider() {
  const area = document.getElementById('countryDateSliderArea');
  if (!area) return;
  const c = currentCountry;
  SUI.dateSlider(area, c.activities || [], {
    onChange: (from, to, filtered) => {
      const tl = document.getElementById('countryTimelineWrap');
      if (tl) tl.innerHTML = SUI.timeline(filtered, {showPoi:true, linkItems:true});

      const typeTable = document.getElementById('activityTypeTable');
      if (typeTable) {
        const counts = filtered.reduce((acc,a)=>{acc[a.type]=(acc[a.type]||0)+1;return acc;},{});
        typeTable.innerHTML = Object.entries(counts).sort((a,b)=>b[1]-a[1])
          .map(([type,count])=>`<tr><td class="text-dim mono" style="font-size:11px">${escHtml(type)}</td>
            <td style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text-hi)">${count}</td></tr>`).join('')
          || '<tr><td class="text-dim" style="font-size:12px">No activities in this range.</td></tr>';
      }

      countryFilteredActivities = filtered;
      if (countryMapObj) renderCountryMarkers();
      const chip = document.getElementById('countryMapCountChip');
      if (chip) chip.textContent = `${filtered.filter(a=>a.lat&&a.lng).length} activities`;
    }
  });
}

/* ── GIS MAP ──────────────────────────────────────────────── */
function initCountryMap() {
  const el = document.getElementById('countryMap');
  if (!el) return;
  if (countryMapObj) { countryMapObj.resize(); return; }

  const c = currentCountry;
  const activities = (c.activities||[]).filter(a=>a.lat&&a.lng);
  const hotspots   = (c.hotspots||[]).filter(h=>h.lat&&h.lng);
  const allPts = [...activities.map(a=>[a.lat,a.lng]), ...hotspots.map(h=>[h.lat,h.lng])];
  const center = allPts.length ? allPts[0] : (c.lat&&c.lng ? [c.lat,c.lng] : [0,20]);

  countryMapObj = MAP.create('countryMap', {center, zoom: allPts.length?6:4, scrollZoom:false});
  countryMapObj.on('load', () => {
    renderCountryMarkers();
    if (allPts.length > 1) MAP.fitToPoints(countryMapObj, allPts, 30);
  });
}

function renderCountryMarkers() {
  countryMarkers.forEach(m=>m.remove()); countryMarkers=[];
  const c = currentCountry;
  const activities = (countryFilteredActivities.length ? countryFilteredActivities : (c.activities||[])).filter(a=>a.lat&&a.lng);
  const hotspots   = (c.hotspots||[]).filter(h=>h.lat&&h.lng);

  activities.forEach(a=>{
    const col = SEV_COL[a.severity] || '#4a8fe8';
    const m = MAP.circleMarker(countryMapObj, a.lat, a.lng, {radius:8, color:col, weight:2});
    const popup = `
      <div class="lp-title">${escHtml(a.type)}</div>
      <div class="lp-row"><span class="lp-label">Location</span><span class="lp-val">${escHtml(a.location)}</span></div>
      <div class="lp-row"><span class="lp-label">Date</span><span class="lp-val">${formatDate(a.date)}</span></div>
      <div class="lp-row"><span class="lp-label">POI</span><span class="lp-val">${escHtml(a.alias||'Unknown')}</span></div>
      <span class="lp-sev lp-sev-${(a.severity||'medium').toLowerCase()}">${a.severity}</span>
      <a href="activity.html?id=${a.id}" class="lp-link hs-popup-link">View full activity →</a>`;
    MAP.bindHoverPopup(m, popup, {maxWidth:'270px', onDblClick: () => { location.href = `activity.html?id=${a.id}`; }});
    countryMarkers.push(m);
  });

  hotspots.forEach(h=>{
    const html = `<div style="width:16px;height:16px;background:#4a8fe8;border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px #4a8fe8aa"></div>`;
    const m = MAP.htmlMarker(countryMapObj, h.lat, h.lng, html);
    const popup = `
      <div class="hs-popup-header">📍 ${escHtml(h.name)}</div>
      <div class="hs-popup-type">${escHtml(h.type)} HOTSPOT</div>
      <span class="lp-sev lp-sev-${(h.risk||'medium').toLowerCase()}">${h.risk}</span>
      ${h.note?`<div class="hs-popup-note">${escHtml(h.note)}</div>`:''}`;
    MAP.bindHoverPopup(m, popup, {maxWidth:'260px'});
    countryMarkers.push(m);
  });
}

/* ── PRINT REPORT ─────────────────────────────────────────── */
async function printCountryReport() {
  const c = currentCountry;
  const persons    = c.persons || [];
  const groups     = c.groups  || [];
  const activities = c.activities || [];
  const hotspots   = c.hotspots || [];
  const critical   = persons.filter(p=>p.risk_level==='CRITICAL').length;
  const highRisk   = persons.filter(p=>['CRITICAL','HIGH'].includes(p.risk_level)).length;

  const personLocs = persons.flatMap(p=>(p.locations||[]).map(l=>({lat:l.lat,lng:l.lng})));
  const groupLocs  = groups.flatMap(g=>(g.locations||[]).map(l=>({lat:l.lat,lng:l.lng})));
  const geoPts = [
    ...activities.filter(a=>a.lat&&a.lng).map(a=>({lat:a.lat,lng:a.lng})),
    ...hotspots.filter(h=>h.lat&&h.lng).map(h=>({lat:h.lat,lng:h.lng})),
    ...personLocs, ...groupLocs,
  ];

  const personPhotos = [
    ...persons.filter(p=>p.photo).map(p=>({src:p.photo,caption:`${p.alias} (${p.id})`})),
    ...persons.flatMap(p=>(p.images||[]).map(im=>({src:im.content,caption:`${p.alias}: ${im.description||im.name||''}`}))),
  ];
  const groupPhotos = groups.flatMap(g=>(g.images||[]).map(im=>({src:im.content,caption:`${g.name}: ${im.description||im.name||''}`})));
  const mapHtml = await staticMapHtml(geoPts, {caption: geoPts.length ? `${geoPts.length} geo-tagged location(s) shown across activities, hotspots and known person/group locations.` : 'No coordinates recorded for this country yet.'});

  printReport(`Country Profile — ${c.name}`, `
    <div class="rpt-header">
      <div class="rpt-photo-empty" style="border-radius:50%;width:96px;height:96px;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#555">
        ${escHtml(c.name.slice(0,2).toUpperCase())}
      </div>
      <div style="flex:1">
        <div class="rpt-class">RESTRICTED</div>
        <h1>SENTINEL — Country Intelligence Profile</h1>
        <p>Generated: ${new Date().toLocaleString()} · Analyst: ${user.name}</p>
        <h2 style="border:none;margin:10px 0 0;padding:0">${escHtml(c.name)}</h2>
        <div style="margin-top:6px">
          <span class="badge badge-blue">${persons.length} POI</span>
          <span class="badge badge-blue">${groups.length} Groups</span>
          <span class="badge badge-blue">${activities.length} Activities</span>
          ${critical?`<span class="badge badge-red">${critical} Critical</span>`:''}
        </div>
      </div>
    </div>

    <h2>Summary</h2>
    <table>
      <tr><td>Total Persons of Interest</td><td>${persons.length}</td></tr>
      <tr><td>Critical-Risk Persons</td><td>${critical}</td></tr>
      <tr><td>High + Critical Risk Persons</td><td>${highRisk}</td></tr>
      <tr><td>Groups Based in Country</td><td>${groups.length}</td></tr>
      <tr><td>Logged Activities</td><td>${activities.length}</td></tr>
      <tr><td>Known Hotspots</td><td>${hotspots.length}</td></tr>
    </table>

    <h2>GIS — Activity, Hotspot &amp; Known Locations</h2>
    ${mapHtml}

    <h2>Persons of Interest (${persons.length})</h2>
    ${reportGalleryHtml(personPhotos, {emptyText:'No photographs on file for persons in this country.'})}
    <table><tr><th>ID</th><th>Alias</th><th>Name</th><th>Risk</th><th>Status</th><th>Last Location</th></tr>
      ${persons.map(p=>`<tr><td>${p.id}</td><td>${escHtml(p.alias)}</td><td>${escHtml(p.first_name||'')} ${escHtml(p.last_name||'')}</td><td>${p.risk_level}</td><td>${p.status}</td><td>${escHtml(p.last_location||'—')}</td></tr>`).join('') || '<tr><td colspan="6">None recorded.</td></tr>'}
    </table>

    <h2>Groups of Interest (${groups.length})</h2>
    ${groupPhotos.length?reportGalleryHtml(groupPhotos, {emptyText:''}):''}
    <table><tr><th>ID</th><th>Name</th><th>Type</th><th>Threat</th><th>Status</th><th>Members</th></tr>
      ${groups.map(g=>`<tr><td>${g.id}</td><td>${escHtml(g.name)}</td><td>${escHtml(g.type||'—')}</td><td>${g.threat_level}</td><td>${g.status}</td><td>${(g.members||[]).length}</td></tr>`).join('') || '<tr><td colspan="6">None recorded.</td></tr>'}
    </table>

    <h2>Activity Timeline (${activities.length})</h2>
    <table><tr><th>Date</th><th>Type</th><th>Location</th><th>Severity</th><th>POI</th><th>Description</th></tr>
      ${activities.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(a=>`<tr><td>${formatDate(a.date)}</td><td>${a.type}</td><td>${escHtml(a.location)}</td><td>${a.severity}</td><td>${escHtml(a.alias||'—')}</td><td>${escHtml(a.description)}</td></tr>`).join('') || '<tr><td colspan="6">None recorded.</td></tr>'}
    </table>

    <h2>Known Hotspots (${hotspots.length})</h2>
    <table><tr><th>Name</th><th>Type</th><th>Risk</th><th>Note</th></tr>
      ${hotspots.map(h=>`<tr><td>${escHtml(h.name)}</td><td>${escHtml(h.type)}</td><td>${h.risk}</td><td>${escHtml(h.note||'')}</td></tr>`).join('') || '<tr><td colspan="4">None recorded.</td></tr>'}
    </table>
  `);
}
</script>
