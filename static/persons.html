<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SENTINEL — Persons of Interest</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css"/>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"/>
  <link rel="stylesheet" href="sentinel.css"/>
  <script>
    /* Apply saved theme before first paint to avoid a flash of the wrong theme */
    (function () {
      var t = localStorage.getItem('snt_theme') === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .poi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
    .poi-card{background:var(--panel);border:1px solid var(--border);padding:16px;display:flex;gap:14px;text-decoration:none;color:inherit;transition:border-color .15s}
    .poi-card:hover{border-color:var(--accent2);background:var(--panel2)}
    .poi-alias{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em}
    .poi-name{font-size:15px;color:var(--text-hi);font-weight:500}
    .poi-meta{font-size:11px;color:var(--text-dim);margin-top:4px}
    .poi-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .poi-desc{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5}
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
    .placeholder-photo{width:90px;height:110px;background:var(--panel2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
    .placeholder-photo svg{width:28px;height:28px;color:var(--muted)}
    .placeholder-photo span{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em}
  </style>
</head>
<body>
<div class="class-banner">⚠ RESTRICTED ACCESS — AUTHORISED PERSONNEL ONLY ⚠</div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-body">
      <div class="page-heading flex-between">
        <div><h2>Persons of Interest</h2><div class="sub" id="poiCount">Loading…</div></div>
        <div class="flex flex-gap-8" id="hdrBtns"></div>
      </div>
      <div class="filters">
        <div class="search-bar"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5"/></svg>
          <input type="text" id="q" placeholder="Search alias, name, nationality, location…" oninput="applyFilters()"/>
        </div>
        <select class="form-select" id="fRisk" style="width:155px" onchange="applyFilters()">
          <option value="">All Risk Levels</option>
          <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
        </select>
        <select class="form-select" id="fStatus" style="width:135px" onchange="applyFilters()">
          <option value="">All Statuses</option><option>ACTIVE</option><option>INACTIVE</option>
        </select>
        <select class="form-select" id="fSort" style="width:155px" onchange="applyFilters()">
          <option value="alias">Sort: Alias</option>
          <option value="risk">Sort: Risk Level</option>
          <option value="lastSeen">Sort: Last Seen</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="printList()"><svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px;display:inline-block;vertical-align:middle"><rect x="3" y="6" width="10" height="7" stroke="currentColor" stroke-width="1.3"/><path d="M5 6V2h6v4" stroke="currentColor" stroke-width="1.3"/><rect x="5" y="9" width="6" height="2" stroke="currentColor" stroke-width="1"/></svg> Export</button>
      </div>
      <div class="poi-grid" id="poiGrid"><div style="color:var(--text-dim);font-size:12px">Loading…</div></div>
    </div>
  </div>
</div>

<!-- Add POI Modal -->
<div class="modal-overlay hidden" id="addModal">
  <div class="modal-box" style="max-width:620px">
    <div class="modal-header"><h3>Add Person of Interest</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('addModal')"><svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px;display:inline-block;vertical-align:middle"><line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Alias / Codename *</label><input class="form-input" id="pAlias" placeholder="e.g. Shadow"/></div>
        <div class="form-group"><label class="form-label">Risk Level *</label>
          <select class="form-select" id="pRisk"><option>LOW</option><option>MEDIUM</option><option selected>HIGH</option><option>CRITICAL</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">First Name</label><input class="form-input" id="pFirst" placeholder="First name"/></div>
        <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="pLast" placeholder="Last name"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" class="form-input" id="pDob"/></div>
        <div class="form-group"><label class="form-label">Nationality</label><input class="form-input" id="pNat" placeholder="Nationality"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="pStatus"><option>ACTIVE</option><option>INACTIVE</option></select>
        </div>
        <div class="form-group"><label class="form-label">Last Known Location</label><input class="form-input" id="pLoc" placeholder="City, Country"/></div>
      </div>
      <div class="form-group">
        <label class="form-label">Coordinates <span style="color:var(--text-dim);font-weight:400">(optional — exact lat/lng, if known)</span></label>
        <div class="form-row">
          <input type="number" step="any" class="form-input" id="pLat" placeholder="Latitude"/>
          <input type="number" step="any" class="form-input" id="pLng" placeholder="Longitude"/>
          <button type="button" class="btn btn-secondary btn-sm" onclick="SUI.pickCoords('pLat','pLng')" style="flex-shrink:0">📍 Pick on Map</button>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="pDesc" placeholder="Background and intelligence summary…"></textarea></div>
      <div class="form-group"><label class="form-label">Operational Notes</label><textarea class="form-textarea" id="pNotes" style="min-height:60px" placeholder="Notes for field personnel…"></textarea></div>
      <div class="form-group"><label class="form-label">Group Affiliations (IDs, comma-separated)</label><input class="form-input" id="pAffil" placeholder="G001, G002"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="savePoi()">Save Person</button>
    </div>
  </div>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="sentinel.js"></script>
<script>
const user = requireAuth();
const canEdit = ['ADMIN','ANALYST'].includes(user.role);
buildSidebar('persons'); buildTopbar([{label:'Persons of Interest'}]); initTopbar();

if(canEdit) document.getElementById('hdrBtns').innerHTML =
  `<button class="btn btn-primary" onclick="openModal('addModal')">${iPlus} Add POI</button>`;

const RISK_ORDER={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,INACTIVE:4};
let allPersons=[], allGroups=[];

(async()=>{
  try {
    [allPersons, allGroups] = await Promise.all([API.persons(), API.groups()]);
    applyFilters();
  } catch(e){ showToast('Failed to load persons: '+e.message,'error'); }
})();

function applyFilters() {
  const q   = document.getElementById('q').value.toLowerCase();
  const risk= document.getElementById('fRisk').value;
  const stat= document.getElementById('fStatus').value;
  const sort= document.getElementById('fSort').value;

  let list = allPersons.filter(p=>{
    if(risk && p.risk_level!==risk) return false;
    if(stat && p.status!==stat) return false;
    if(q && !`${p.alias} ${p.first_name} ${p.last_name} ${p.nationality} ${p.last_location}`.toLowerCase().includes(q)) return false;
    return true;
  });

  if(sort==='risk')    list.sort((a,b)=>(RISK_ORDER[a.risk_level]??9)-(RISK_ORDER[b.risk_level]??9));
  else if(sort==='lastSeen') list.sort((a,b)=>(b.last_seen||'').localeCompare(a.last_seen||''));
  else list.sort((a,b)=>a.alias.localeCompare(b.alias));

  document.getElementById('poiCount').textContent=`${list.length} person${list.length!==1?'s':''} found`;

  document.getElementById('poiGrid').innerHTML = list.length ? list.map(p=>{
    const affGrps=(p.affiliation||[]).map(gid=>{const g=allGroups.find(x=>x.id===gid);return g?`<span class="badge badge-blue" style="font-size:9px">${escHtml(g.name)}</span>`:''}).join('');
    const photo = p.photo ? `<img src="${p.photo}" style="width:90px;height:110px;object-fit:cover;display:block"/>` :
      `<div class="placeholder-photo">${iUsers}<span>NO PHOTO</span></div>`;
    return `<a href="person.html?id=${p.id}" class="poi-card">
      <div style="flex-shrink:0">${photo}</div>
      <div style="flex:1;min-width:0">
        <div class="poi-alias">${escHtml(p.id)} · ${escHtml(p.alias)}</div>
        <div class="poi-name">${escHtml(p.first_name)} ${escHtml(p.last_name)}</div>
        <div class="poi-meta">${escHtml(p.nationality||'Unknown')} · Last: ${formatDate(p.last_seen)} · ${escHtml(p.last_location||'Unknown')}</div>
        <div class="poi-badges">
          ${riskBadge(p.risk_level)} ${statusBadge(p.status)}
          <span class="badge badge-grey">${p.activityCount||0} activities</span>
          ${affGrps}
        </div>
        <div class="poi-desc">${escHtml((p.description||'').slice(0,100))}${(p.description||'').length>100?'…':''}</div>
      </div>
    </a>`;
  }).join('') : '<div style="padding:32px;text-align:center;color:var(--text-dim);font-family:\'JetBrains Mono\',monospace;font-size:12px">No persons found matching the current filters.</div>';
}

async function savePoi() {
  const alias=document.getElementById('pAlias').value.trim();
  if(!alias){ showToast('Alias is required','error'); return; }
  try {
    const r=await API.createPerson({
      alias, firstName:document.getElementById('pFirst').value.trim(),
      lastName:document.getElementById('pLast').value.trim(),
      dob:document.getElementById('pDob').value,
      nationality:document.getElementById('pNat').value.trim(),
      riskLevel:document.getElementById('pRisk').value,
      status:document.getElementById('pStatus').value,
      lastLocation:document.getElementById('pLoc').value.trim(),
      lastLat:document.getElementById('pLat').value, lastLng:document.getElementById('pLng').value,
      description:document.getElementById('pDesc').value.trim(),
      notes:document.getElementById('pNotes').value.trim(),
      affiliation:document.getElementById('pAffil').value.split(',').map(s=>s.trim()).filter(Boolean),
    });
    closeModal('addModal');
    showToast('Person saved','success');
    location.href='person.html?id='+r.id;
  } catch(e){ showToast(e.message,'error'); }
}

function printList() {
  const rows=allPersons.map(p=>`<tr><td>${p.id}</td><td>${escHtml(p.alias)}</td><td>${escHtml(p.first_name)} ${escHtml(p.last_name)}</td><td>${p.risk_level}</td><td>${p.status}</td><td>${formatDate(p.last_seen)}</td><td>${escHtml(p.last_location)}</td></tr>`).join('');
  printReport('Persons of Interest',`<h1>SENTINEL — Persons of Interest</h1><p>Generated: ${new Date().toLocaleString()} · Analyst: ${user.name}</p><table><thead><tr><th>ID</th><th>Alias</th><th>Name</th><th>Risk</th><th>Status</th><th>Last Seen</th><th>Location</th></tr></thead><tbody>${rows}</tbody></table>`);
}

if(new URLSearchParams(location.search).get('new')==='1' && canEdit) openModal('addModal');
</script>
</body>
</html>
