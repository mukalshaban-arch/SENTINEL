<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL – Login</title>
    <link rel="stylesheet" href="sentinel.css">
    <style>
        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin: 0;
        }
        .login-logo p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .form-group input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-login {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            letter-spacing: 0.04em;
            transition: opacity 0.15s;
        }
        .btn-login:hover { opacity: 0.88; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            color: var(--danger, #e05a5a);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            min-height: 1.2em;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <h1>SENTINEL</h1>
            <p>Intelligence Tracking System</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       autofocus autocomplete="username" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>
</div>

<script src="/sentinel.js"></script>
<script>
    // ── GUARD: if already logged in, go straight to dashboard ──
    if (getUser()) {
        location.replace('dashboard.html');
    } else {
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const errorEl  = document.getElementById('loginError');
            const btn      = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorEl.textContent = '';
            if (!username || !password) {
                errorEl.textContent = 'Username and password are required.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            try {
                await API.login(username, password);
                location.replace('dashboard.html');
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed.';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    }
</script>

</body>
</html>
