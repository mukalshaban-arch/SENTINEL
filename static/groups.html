<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SENTINEL — Groups of Interest</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css"/>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"/>
  <link rel="stylesheet" href="sentinel.css"/>
  <script>
    /* Apply saved theme before first paint to avoid a flash of the wrong theme */
    (function () {
      var t = localStorage.getItem('snt_theme') === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .group-card{background:var(--panel);border:1px solid var(--border);padding:20px;
      text-decoration:none;color:inherit;display:block;transition:border-color .15s}
    .group-card:hover{border-color:var(--accent2);background:var(--panel2)}
    .group-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .group-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text-hi);letter-spacing:.04em}
    .group-type{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em;margin-top:2px}
    .group-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-top:10px}
    .group-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:8px}
    .group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  </style>
</head>
<body>
<div class="class-banner">⚠ RESTRICTED ACCESS — AUTHORISED PERSONNEL ONLY ⚠</div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-body">

      <div class="page-heading flex-between">
        <div><h2>Groups of Interest</h2><div class="sub" id="grpCount">Loading…</div></div>
        <div class="flex flex-gap-8" id="hdrBtns"></div>
      </div>

      <div class="filters">
        <div class="search-bar">
          <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px;flex-shrink:0"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5"/></svg>
          <input type="text" id="searchInput" placeholder="Search name, type, base…" oninput="renderList()"/>
        </div>
        <select class="form-select" id="filterThreat" style="width:160px" onchange="renderList()">
          <option value="">All Threat Levels</option>
          <option value="CRITICAL">Critical</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
        <select class="form-select" id="filterStatus" style="width:140px" onchange="renderList()">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
          <option value="DORMANT">Dormant</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="printGroupList()">
          <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px"><rect x="3" y="6" width="10" height="7" stroke="currentColor" stroke-width="1.3"/><path d="M5 6V2h6v4" stroke="currentColor" stroke-width="1.3"/><rect x="5" y="9" width="6" height="2" stroke="currentColor" stroke-width="1"/></svg>
          Export
        </button>
      </div>

      <div class="group-grid" id="grpList">
        <div style="color:var(--text-dim);font-size:12px">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Add Group Modal -->
<div class="modal-overlay hidden" id="addGrpModal">
  <div class="modal-box" style="max-width:620px">
    <div class="modal-header">
      <h3>Add Group of Interest</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('addGrpModal')">
        <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px"><line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Group Name *</label>
        <input class="form-input" id="gName" placeholder="Organisation name"/></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Type</label>
          <select class="form-select" id="gType">
            <option>Criminal Organization</option><option>Extremist Group</option>
            <option>Terrorist Cell</option><option>Gang</option>
            <option>Political Group</option><option>Other</option>
          </select></div>
        <div class="form-group"><label class="form-label">Threat Level</label>
          <select class="form-select" id="gThreat">
            <option>LOW</option><option>MEDIUM</option><option selected>HIGH</option><option>CRITICAL</option>
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="gStatus">
            <option>ACTIVE</option><option>INACTIVE</option><option>DORMANT</option>
          </select></div>
        <div class="form-group"><label class="form-label">Year Founded</label>
          <input class="form-input" id="gFounded" placeholder="e.g. 2019"/></div>
      </div>
      <div class="form-group"><label class="form-label">Base / Area of Operations</label>
        <input class="form-input" id="gBase" placeholder="City, Country"/></div>
      <div class="form-group">
        <label class="form-label">Coordinates <span style="color:var(--text-dim);font-weight:400">(optional — exact lat/lng, if known)</span></label>
        <div class="form-row">
          <input type="number" step="any" class="form-input" id="gLat" placeholder="Latitude"/>
          <input type="number" step="any" class="form-input" id="gLng" placeholder="Longitude"/>
          <button type="button" class="btn btn-secondary btn-sm" onclick="SUI.pickCoords('gLat','gLng')" style="flex-shrink:0">📍 Pick on Map</button>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Leader (POI ID, optional)</label>
        <input class="form-input" id="gLeader" placeholder="e.g. P001"/></div>
      <div class="form-group"><label class="form-label">Member POI IDs (comma-separated)</label>
        <input class="form-input" id="gMembers" placeholder="e.g. P001, P002"/></div>
      <div class="form-group"><label class="form-label">Description</label>
        <textarea class="form-textarea" id="gDesc" placeholder="Background, structure, activities…"></textarea></div>
      <div class="form-group"><label class="form-label">Known Objectives</label>
        <textarea class="form-textarea" id="gObj" style="min-height:60px" placeholder="What does this group want to achieve?"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('addGrpModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveGroup()">Save Group</button>
    </div>
  </div>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="sentinel.js"></script>
<script>
const user = requireAuth();
const canEdit = ['ADMIN','ANALYST'].includes(user.role);

buildSidebar('groups');
buildTopbar([{label:'Groups of Interest'}]);
initTopbar();

if (canEdit) {
  document.getElementById('hdrBtns').innerHTML = `
    <button class="btn btn-primary" onclick="openModal('addGrpModal')">
      <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px"><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
      Add Group
    </button>`;
}

let allGroups = [], allPersons = [];

(async () => {
  try {
    [allGroups, allPersons] = await Promise.all([API.groups(), API.persons()]);
    renderList();
  } catch(e) { showToast('Failed to load groups: ' + e.message, 'error'); }
})();

function renderList() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const threat = document.getElementById('filterThreat').value;
  const status = document.getElementById('filterStatus').value;

  let list = allGroups.filter(g => {
    if (threat && g.threat_level !== threat) return false;
    if (status && g.status !== status) return false;
    if (q && !`${g.name} ${g.type||''} ${g.base||''}`.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('grpCount').textContent =
    `${list.length} group${list.length !== 1 ? 's' : ''} found`;

  if (!list.length) {
    document.getElementById('grpList').innerHTML =
      '<div style="padding:32px;text-align:center;color:var(--text-dim);font-family:\'JetBrains Mono\',monospace;font-size:12px">No groups match the current filters.</div>';
    return;
  }

  document.getElementById('grpList').innerHTML = list.map(g => {
    const members = (g.members||[]).map(mid => allPersons.find(p=>p.id===mid)).filter(Boolean);
    const leader  = allPersons.find(p => p.id === g.leader_id);
    return `
      <a href="group.html?id=${g.id}" class="group-card">
        <div class="group-card-header">
          <div>
            <div class="group-name">${escHtml(g.name)}</div>
            <div class="group-type">${escHtml(g.id)} · ${escHtml(g.type||'Unknown type')}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
            ${threatBadge(g.threat_level)}
            ${statusBadge(g.status)}
          </div>
        </div>
        <div class="group-meta">
          <span>📍 ${escHtml(g.base||'Location unknown')}</span>
          <span>👥 ${members.length} member${members.length!==1?'s':''}</span>
          ${g.founded ? `<span>Est. ${escHtml(g.founded)}</span>` : ''}
          <span>📌 ${g.activityCount||0} activities</span>
          ${leader ? `<span>Leader: <strong style="color:var(--text)">${escHtml(leader.alias)}</strong></span>` : ''}
        </div>
        <div class="group-desc">${escHtml((g.description||'').slice(0,130))}${(g.description||'').length>130?'…':''}</div>
      </a>`;
  }).join('');
}

async function saveGroup() {
  const name = document.getElementById('gName').value.trim();
  if (!name) { showToast('Group name is required', 'error'); return; }
  try {
    const r = await API.createGroup({
      name,
      type:        document.getElementById('gType').value,
      threatLevel: document.getElementById('gThreat').value,
      status:      document.getElementById('gStatus').value,
      founded:     document.getElementById('gFounded').value.trim(),
      base:        document.getElementById('gBase').value.trim(),
      baseLat:     document.getElementById('gLat').value, baseLng: document.getElementById('gLng').value,
      leaderId:    document.getElementById('gLeader').value.trim() || null,
      members:     document.getElementById('gMembers').value.split(',').map(s=>s.trim()).filter(Boolean),
      description: document.getElementById('gDesc').value.trim(),
      objectives:  document.getElementById('gObj').value.trim(),
    });
    closeModal('addGrpModal');
    showToast('Group saved', 'success');
    location.href = 'group.html?id=' + r.id;
  } catch(e) { showToast(e.message, 'error'); }
}

function printGroupList() {
  const rows = allGroups.map(g =>
    `<tr><td>${g.id}</td><td>${escHtml(g.name)}</td><td>${escHtml(g.type||'')}</td>
     <td>${g.threat_level}</td><td>${g.status}</td><td>${escHtml(g.base||'')}</td>
     <td>${(g.members||[]).length}</td></tr>`).join('');
  printReport('Groups of Interest',
    `<h1>SENTINEL — Groups of Interest</h1>
     <p>Generated: ${new Date().toLocaleString()} · Analyst: ${user.name} · RESTRICTED</p>
     <table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Threat</th>
     <th>Status</th><th>Base</th><th>Members</th></tr></thead>
     <tbody>${rows}</tbody></table>`);
}

if (new URLSearchParams(location.search).get('new') === '1' && canEdit) openModal('addGrpModal');
</script>
</body>
</html>
